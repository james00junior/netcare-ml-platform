[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netcare-ml-platform"
version = "0.1.0"
description = "Production ML platform for hospital 30-day readmission prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary"}
authors = [
    {name = "Netcare ML Team"}
]
dependencies = [
    "pandas==3.0.5",
    "numpy==1.26.4",
    "scikit-learn==1.3.0",
    "xgboost==3.2.0",
    "mlflow==3.16.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "joblib==1.6.0",
    "matplotlib==3.11.1",
    "scipy==1.11.1",
    "cloudpickle==3.1.2",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]
monitoring = [
    "evidently>=0.4.0",
    "great-expectations>=0.18.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

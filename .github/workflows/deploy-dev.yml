name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run tests
        run: pytest tests/ -v

      # Placeholder – expand with Azure login + Databricks bundle deploy
      - name: Deploy to Databricks (dev)
        run: |
          echo "TODO: databricks bundle deploy -t dev"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy Azure ML endpoint (dev)
        run: |
          echo "TODO: az ml online-endpoint update / create"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
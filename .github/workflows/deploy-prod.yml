name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Deploy to Databricks (prod)
        run: |
          echo "TODO: databricks bundle deploy -t prod"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy Azure ML endpoint (prod)
        run: |
          echo "TODO: az ml online-endpoint update / create --resource-group ... --name ..."
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
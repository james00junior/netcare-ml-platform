name: One-time format and lint cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply lint and formatting fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Apply Ruff fixes
        run: ruff check --fix src tests api

      - name: Apply Black formatting
        run: black src tests api

      - name: Run verification
        run: |
          ruff check src tests api
          black --check src tests api
          pytest tests/ -q

      - name: Commit cleanup and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-fix.yml
          git add src tests api
          git commit -m "chore: apply lint and formatting fixes"
          git push origin main

      - name: Trigger CI for formatted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

resources:
  jobs:
    train_readmission_model:
      name: ${bundle.target}-netcare-readmission-training
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: experiment_name
          default: ${var.experiment_name}
        - name: raw_data_path
          default: gs://databricks-8259552034754034/hospital_readmissions.csv
      job_clusters:
        - job_cluster_key: training_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "n2-standard-4"
            driver_node_type_id: "n2-standard-4"
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../../notebooks/02_databricks_training.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              experiment_name: ${var.experiment_name}
              registered_model_name: ${var.registered_model_name}
              raw_data_path: gs://databricks-8259552034754034/hospital_readmissions.csv
          job_cluster_key: training_cluster

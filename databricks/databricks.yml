bundle:
  name: netcare-ml-platform
  engine: direct

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog used by this environment
    default: nectare
  experiment_name:
    description: MLflow experiment name
    default: netcare-readmission
  registered_model_name:
    description: Unity Catalog registered model name
    default: nectare.ml.readmission_model

# The bundle lives under databricks/, while application code and notebooks
# live at the repository root. sync.paths explicitly includes those shared
# directories, which is required when files live outside the bundle root.
sync:
  paths:
    - .
    - ../src
    - ../notebooks

# Each target represents a separate Databricks deployment environment.
# DEV is pinned to the validated GCP workspace. Credentials remain outside Git.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://8259552034754034.4.gcp.databricks.com
    variables:
      catalog_name: nectare

  staging:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_STAGING}
    variables:
      catalog_name: nectare

  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    variables:
      catalog_name: nectare

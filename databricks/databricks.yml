bundle:
  name: netcare-ml-platform
  engine: direct

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog used by this environment
    default: nectare
  experiment_name:
    description: Absolute Databricks workspace path for the MLflow experiment
    default: /Shared/netcare-readmission
  registered_model_name:
    description: Unity Catalog registered model name
    default: nectare.ml.readmission_model

# Build the application as a Python wheel so Databricks jobs receive the
# src package through the task environment instead of relying on sys.path.
# The project pyproject.toml lives one level above this bundle directory.
artifacts:
  default:
    type: whl
    path: ..
    build: uv build --wheel
    dynamic_version: true

# The bundle lives under databricks/, while notebooks and application code
# live at the repository root. sync.paths includes those shared directories.
sync:
  paths:
    - .
    - ../src
    - ../notebooks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://8259552034754034.4.gcp.databricks.com
    variables:
      catalog_name: nectare

  staging:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_STAGING}
    variables:
      catalog_name: nectare

  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    variables:
      catalog_name: nectare

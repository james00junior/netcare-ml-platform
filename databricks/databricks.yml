bundle:
  name: netcare-ml-platform
  engine: direct

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog used by this environment
    default: netcareaidatabricks
  experiment_name:
    description: Absolute Databricks workspace path for the MLflow experiment
    default: /Shared/netcare-readmission
  registered_model_name:
    description: Unity Catalog registered model name
    default: netcareaidatabricks.ml.readmission_model

artifacts:
  default:
    type: whl
    path: ..
    build: python -m pip wheel . --wheel-dir dist --no-deps
    files:
      - source: ../dist/*.whl

sync:
  paths:
    - ../notebooks

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://8259552034754034.4.gcp.databricks.com
    variables:
      catalog_name: netcareaidatabricks

  staging:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_STAGING}
    variables:
      catalog_name: netcareaidatabricks

  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    variables:
      catalog_name: netcareaidatabricks

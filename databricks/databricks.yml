bundle:
  name: netcare-ml-platform
  engine: direct

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog used by this environment
    default: netcareaidatabricks
  experiment_name:
    description: Absolute Databricks workspace path for the MLflow experiment
    default: /Shared/netcare-readmission
  registered_model_name:
    description: Unity Catalog registered model name
    default: netcareaidatabricks.default.readmission_model
  serving_model_version:
    description: Registered model version deployed to the protected serving endpoint
    default: "1"
  serving_candidate_model_version:
    description: Explicit registered model version deployed only to the isolated Phase 7 candidate endpoint
    default: "8"

artifacts:
  default:
    type: whl
    path: ..
    build: python -m pip wheel . --wheel-dir dist --no-deps
    files:
      - source: ../dist/*.whl

sync:
  paths:
    - ../notebooks

targets:
  dev:
    mode: production
    default: true
    presets:
      name_prefix: "ci-"
    variables:
      catalog_name: netcareaidatabricks

  staging:
    mode: production
    variables:
      catalog_name: netcareaidatabricks

  prod:
    mode: production
    variables:
      catalog_name: netcareaidatabricks
